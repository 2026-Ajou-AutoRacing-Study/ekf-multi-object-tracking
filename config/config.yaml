topic_name:
  lidar_objects: /hmi/perc/jsk_pillar_objects
  odometry: /novatel/oem7/odom
  output_track_jsk: /app/perc/jsk_all_track
  output_track_marker: /app/perc/vis_all_track
  
configure:
  input_localization: 0  # 0: None, 1: nav_msgs/Odometry
  
  global_coord_track: true # standardized detections are transformed to map before tracking
  output_local_coord: false  # standardized output remains in map
  output_period_lidar: true  # publish once per detector measurement
  output_confirmed_track: true  # false: output all track, true: output confirmed track

  use_predefined_ref_point: false  # false: use initial lat lon as ref, true: use defined ref
  reference_lat: 37.23855064
  reference_lon: 126.77253029
  reference_height: 0.0

  cal_detection_individual_time: false  # LiDAR Motion compensation
  lidar_rotation_period: 0.1
  lidar_sync_scan_start: false  # false: Sync lidar time to scan end, true: Sync lidar time to scan start

  max_association_dist_m: 5.0 # Maximum association distance
  prediction_model: 1  # Team default: CTRV (0: CV, 1: CTRV, 2: CA, 3: CTRA)
  system_noise_std_xy_m: 0.01
  system_noise_std_yaw_deg: 0.5
  system_noise_std_vx_vy_ms: 1.0
  system_noise_std_yaw_rate_degs: 1.0
  system_noise_std_ax_ay_ms2: 0.6
  # MORAI online three-bag A/B: 0.40 m reduced speed/AVE and Map-CV FDE
  # with a small center-error trade-off versus the historical 0.30 m.
  meas_noise_std_xy_m: 0.4
  meas_noise_std_yaw_deg: 10.00
  # Optional detector velocity measurement. Production detectors currently
  # publish has_twist=false, so mode 0 preserves the position-only tracker.
  # 0: off, 1: initialize only, 2: initialize and update on every detection.
  detection_velocity_fusion_mode: 0
  detection_velocity_noise_std_mps: 1.0
  # Experimental B4H-Q0: derive a causal map-frame velocity observation from
  # associated raw detection centers. Production remains false until the
  # tracking/Map-CV held-out gate is passed.
  center_motion_velocity_fusion: false
  center_motion_fuse_ekf_state: true
  center_motion_override_output_velocity: false
  center_motion_maximum_output_age_sec: 0.40
  center_motion_min_baseline_sec: 0.30
  center_motion_medium_baseline_sec: 0.65
  center_motion_long_baseline_sec: 0.90
  center_motion_max_gap_sec: 0.25
  # Overlapping displacement windows are strongly correlated; do not feed
  # them to the EKF as independent measurements every detector frame.
  center_motion_min_update_interval_sec: 0.20
  center_motion_max_fit_residual_m: 0.10
  center_motion_early_noise_std_mps: 1.50
  center_motion_mature_noise_std_mps: 0.60

  dimension_filter_alpha: 0.3  # 0.0: High filtering ~ 1.0: Use Current size
  use_kinematic_model: false  # Align velocity direction to heading.
  use_yaw_rate_filtering: true  # Restrict Yawrate based on velocity
  # Resolve the pi ambiguity of moving vehicle boxes at the standardized
  # TrackedObjects boundary. The EKF world velocity is preserved; only the
  # equivalent body heading/signed longitudinal velocity representation is
  # canonicalized. Low-speed tracks retain their previous decision.
  canonicalize_vehicle_orientation_to_motion: true
  orientation_canonicalization_min_speed_mps: 1.0
  orientation_flip_enter_error_deg: 100.0
  orientation_flip_exit_error_deg: 80.0
  # Publish a non-mutating prediction of the measurement-time EKF state at
  # current ROS time. This covers rolling-scan age plus detector latency while
  # preserving the true measurement dt inside the filter.
  # Experimental only. Offline A/B on the MORAI bags showed that projecting
  # the state through detector/queue latency slightly worsened long-horizon
  # prediction, so production keeps the honest measurement-time state.
  compensate_output_to_current_time: false
  maximum_output_compensation_sec: 0.25
  # 0.0: publish on each detector measurement. Positive values enable the
  # EKF node's own ROS-time scheduler and publish predicted state copies at
  # the requested rate without mutating the measurement-time filter state.
  fixed_output_rate_hz: 0.0
  maximum_fixed_output_prediction_age_sec: 0.25
  max_steer_deg: 30.0

  visualize_mesh: false

vehicle_origin:
  vehicle_origin: 0  # 0: Rear Axle, 1: C.G.


rear_to_main_lidar:
  parent_frame_id: ego_frame
  child_frame_id: velodyne
  transform_xyz_m: [1.2, 0.0, 1.88]
  rotation_rpy_deg: [0.0, 0.0, 0.0]

cg_to_main_lidar:
  parent_frame_id: ego_frame
  child_frame_id: velodyne
  transform_xyz_m: [-0.31, 0.0, 1.88]
  rotation_rpy_deg: [0.0, 0.0, 0.0]
  
